[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
gum = "0.17.0"
uv = "0.11.15"
ruff = "0.15.20"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"

[_.codebase]
name = "permissions"
lint = ["@all"]
# Codebase #143: uses-only security workflows currently trigger a parser error.
lint_exclude = ["ci-lint-enforcement"]
